name: listo
description: "Listo - Your Personal Online Assistant"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1
  intl: ^0.19.0
  
  # State Management
  provider: ^6.1.2
  flutter_riverpod: ^2.6.1
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.4
  google_sign_in: ^6.2.2
  
  # Local Storage
  shared_preferences: ^2.3.4
  
  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.0
  
  # Calendar
  table_calendar: ^3.1.2
  device_calendar: ^4.3.2
  
  # Voice & Speech
  speech_to_text: ^7.1.0
  flutter_tts: ^4.2.0
  permission_handler: ^11.4.0
  
  # Utilities
  uuid: ^4.5.1
  connectivity_plus: ^6.1.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  
  # Networking
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/